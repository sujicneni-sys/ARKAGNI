[project]
name = "arkagni"
version = "0.1.0"
description = "MODIS/VIIRS fire radiative power harmonization with calibrated uncertainty and applicability gating"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

dependencies = [
    "fastapi==0.162.2",
    "numpy==2.5.4",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "pydantic==2.14.3",
    "PyYAML==6.0.2",
    "python-dateutil==4.0.0",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "tzdata==2026.6",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest==9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::FutureWarning"]
